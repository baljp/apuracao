<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#f0e8d8"/><text x="88" y="122" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" letter-spacing="0" opacity="1">OXE,</text><text x="172" y="122" text-anchor="start" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="26" font-weight="400" letter-spacing="0" opacity="1">era assim?</text><circle cx="960" cy="112" r="19.3" fill="#e09a62"/><path d="M 932.3 112 A 27.7 27.7 0 0 1 987.7 112" fill="none" stroke="#e09a62" stroke-width="7" opacity="0.90"/><path d="M 924.7 112 A 35.3 35.3 0 0 1 995.3 112" fill="none" stroke="#e09a62" stroke-width="6" opacity="0.72"/><path d="M 918.0 112 A 42.0 42.0 0 0 1 1002.0 112" fill="none" stroke="#e09a62" stroke-width="5" opacity="0.54"/><rect x="88" y="152" width="904" height="3" fill="#1c1b19" opacity="0.18"/><text x="540.0" y="272" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="60" font-weight="700" letter-spacing="0" opacity="1">Vamos tentar antecipar</text><text x="540.0" y="344" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="60" font-weight="700" letter-spacing="0" opacity="1">o resultado da eleição</text><rect x="460.0" y="388" width="160" height="4" fill="#c8433a"/><text x="540.0" y="452" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="30" font-weight="400" letter-spacing="0" opacity="1">Um algoritmo preditivo acompanha a apuração e</text><text x="540.0" y="492" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="30" font-weight="400" letter-spacing="0" opacity="1">estima onde ela vai terminar. É uma tentativa,</text><text x="540.0" y="532" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="30" font-weight="400" letter-spacing="0" opacity="1">baseada nas cinco últimas eleições —</text><text x="540.0" y="572" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" letter-spacing="0" opacity="1">e não é garantia de acerto.</text><rect x="60" y="632" width="960" height="214" rx="12" fill="#c8433a"/><text x="540.0" y="716" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="56" font-weight="700" letter-spacing="2" opacity="1">ISTO NÃO É</text><text x="540.0" y="782" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="56" font-weight="700" letter-spacing="2" opacity="1">RESULTADO OFICIAL</text><text x="540.0" y="822" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="27" font-weight="400" letter-spacing="0" opacity="0.92">O resultado que vale é sempre o do TSE.</text><text x="540.0" y="930" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="31" font-weight="700" letter-spacing="0" opacity="1">Quanto o modelo errou nas últimas 5 eleições</text><text x="540.0" y="972" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="25" font-weight="400" letter-spacing="0" opacity="1">(em pontos percentuais)</text><rect x="72" y="1018" width="936" height="380" rx="12" fill="#e4dac4"/><text x="190" y="1066" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" letter-spacing="2" opacity="1">APURADO</text><text x="610" y="1066" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" letter-spacing="2" opacity="1">EM MÉDIA</text><text x="890" y="1066" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" letter-spacing="2" opacity="1">PIOR CASO</text><rect x="100" y="1090" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="190" y="1142" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">5%</text><text x="610" y="1142" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">± 0,96</text><text x="890" y="1142" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="36" font-weight="400" letter-spacing="0" opacity="1">± 1,83</text><rect x="100" y="1164" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="190" y="1216" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">20%</text><text x="610" y="1216" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">± 0,73</text><text x="890" y="1216" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="36" font-weight="400" letter-spacing="0" opacity="1">± 1,57</text><rect x="100" y="1238" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="190" y="1290" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">50%</text><text x="610" y="1290" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">± 0,30</text><text x="890" y="1290" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="36" font-weight="400" letter-spacing="0" opacity="1">± 0,79</text><rect x="100" y="1312" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="190" y="1364" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">75%</text><text x="610" y="1364" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="36" font-weight="700" letter-spacing="0" opacity="1">± 0,14</text><text x="890" y="1364" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="36" font-weight="400" letter-spacing="0" opacity="1">± 0,43</text><text x="540.0" y="1424" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="27" font-weight="400" letter-spacing="0" opacity="1">Numa disputa decidida por menos que isso, a projeção</text><text x="540.0" y="1462" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="27" font-weight="400" letter-spacing="0" opacity="1">pode apontar o candidato errado no começo da noite.</text><rect x="88" y="1522" width="4" height="78" fill="#3d7a4f"/><text x="126" y="1554" text-anchor="start" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" letter-spacing="3" opacity="1">A APURAÇÃO</text><text x="126" y="1592" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="28" font-weight="400" letter-spacing="0" opacity="1">Projeção ao vivo, ajustada a cada urna contada.</text><rect x="88" y="1628" width="4" height="118" fill="#c8433a"/><text x="126" y="1660" text-anchor="start" fill="#c8433a" font-family="Lora, Georgia, serif" font-size="24" font-weight="700" letter-spacing="3" opacity="1">AS PESQUISAS</text><text x="126" y="1698" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="27" font-weight="400" letter-spacing="0" opacity="1">Sempre as mais recentes, com média ponderada por</text><text x="126" y="1734" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="27" font-weight="400" letter-spacing="0" opacity="1">pesquisa — atualizada assim que sai uma nova.</text><rect x="0" y="1786" width="1080" height="134" fill="#1c1b19"/><text x="540.0" y="1843" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="35" font-weight="700" letter-spacing="0" opacity="1">oxeeraassim.github.io/apuracao</text><text x="540.0" y="1890" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="25" font-weight="400" letter-spacing="2" opacity="0.8">@oxe_eraassim</text></svg>