<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#f0e8d8"/><text x="88" y="122" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" letter-spacing="0" opacity="1">OXE,</text><text x="172" y="122" text-anchor="start" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="26" font-weight="400" letter-spacing="0" opacity="1">era assim?</text><circle cx="960" cy="112" r="19.3" fill="#e09a62"/><path d="M 932.3 112 A 27.7 27.7 0 0 1 987.7 112" fill="none" stroke="#e09a62" stroke-width="7" opacity="0.90"/><path d="M 924.7 112 A 35.3 35.3 0 0 1 995.3 112" fill="none" stroke="#e09a62" stroke-width="6" opacity="0.72"/><path d="M 918.0 112 A 42.0 42.0 0 0 1 1002.0 112" fill="none" stroke="#e09a62" stroke-width="5" opacity="0.54"/><rect x="88" y="152" width="904" height="3" fill="#1c1b19" opacity="0.18"/><text x="540.0" y="290" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="56" font-weight="700" letter-spacing="0" opacity="1">Quanto o modelo errou</text><text x="540.0" y="358" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="56" font-weight="700" letter-spacing="0" opacity="1">nas últimas 5 eleições</text><text x="540.0" y="412" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="27" font-weight="400" letter-spacing="0" opacity="1">(em pontos percentuais)</text><rect x="72" y="466" width="936" height="476" rx="14" fill="#e4dac4"/><text x="195" y="524" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" letter-spacing="2" opacity="1">APURADO</text><text x="610" y="524" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" letter-spacing="2" opacity="1">EM MÉDIA</text><text x="890" y="524" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" letter-spacing="2" opacity="1">PIOR CASO</text><rect x="100" y="556" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="620" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">5%</text><text x="610" y="620" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">± 0,96</text><text x="890" y="620" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="44" font-weight="400" letter-spacing="0" opacity="1">± 1,83</text><rect x="100" y="648" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="712" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">20%</text><text x="610" y="712" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">± 0,73</text><text x="890" y="712" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="44" font-weight="400" letter-spacing="0" opacity="1">± 1,57</text><rect x="100" y="740" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="804" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">50%</text><text x="610" y="804" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">± 0,30</text><text x="890" y="804" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="44" font-weight="400" letter-spacing="0" opacity="1">± 0,79</text><rect x="100" y="832" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="896" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">75%</text><text x="610" y="896" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" letter-spacing="0" opacity="1">± 0,14</text><text x="890" y="896" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="44" font-weight="400" letter-spacing="0" opacity="1">± 0,43</text><text x="540.0" y="1016" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="30" font-weight="400" letter-spacing="0" opacity="1">Numa disputa decidida por menos que isso,</text><text x="540.0" y="1060" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" letter-spacing="0" opacity="1">a projeção pode apontar o candidato errado</text><text x="540.0" y="1104" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" letter-spacing="0" opacity="1">no começo da noite.</text><rect x="88" y="1320" width="4" height="124" fill="#3d7a4f"/><text x="126" y="1354" text-anchor="start" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" letter-spacing="3" opacity="1">A APURAÇÃO</text><text x="126" y="1398" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">Projeção ao vivo com os dados oficiais do</text><text x="126" y="1436" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">TSE, ajustada a cada urna contada.</text><rect x="88" y="1490" width="4" height="164" fill="#c8433a"/><text x="126" y="1524" text-anchor="start" fill="#c8433a" font-family="Lora, Georgia, serif" font-size="26" font-weight="700" letter-spacing="3" opacity="1">AS PESQUISAS</text><text x="126" y="1568" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">Sempre as mais recentes, com a porcentagem</text><text x="126" y="1606" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">ponderada por pesquisa — atualizada assim</text><text x="126" y="1644" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">que uma nova é divulgada.</text><rect x="0" y="1786" width="1080" height="134" fill="#c8433a"/><text x="540.0" y="1843" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="35" font-weight="700" letter-spacing="0" opacity="1">oxeeraassim.github.io/apuracao</text><text x="540.0" y="1890" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="25" font-weight="400" letter-spacing="2" opacity="0.8">@oxe_eraassim</text></svg>