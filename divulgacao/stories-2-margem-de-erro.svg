<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#f0e8d8"/><text x="88" y="122" text-anchor="start" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" letter-spacing="0" opacity="1">OXE,</text><text x="172" y="122" text-anchor="start" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="26" font-weight="400" letter-spacing="0" opacity="1">era assim?</text><circle cx="960" cy="112" r="19.3" fill="#e09a62"/><path d="M 932.3 112 A 27.7 27.7 0 0 1 987.7 112" fill="none" stroke="#e09a62" stroke-width="7" opacity="0.90"/><path d="M 924.7 112 A 35.3 35.3 0 0 1 995.3 112" fill="none" stroke="#e09a62" stroke-width="6" opacity="0.72"/><path d="M 918.0 112 A 42.0 42.0 0 0 1 1002.0 112" fill="none" stroke="#e09a62" stroke-width="5" opacity="0.54"/><rect x="88" y="152" width="904" height="3" fill="#1c1b19" opacity="0.18"/><text x="540.0" y="272" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="58" font-weight="700" letter-spacing="0" opacity="1">E pode errar.</text><text x="540.0" y="342" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="58" font-weight="700" letter-spacing="0" opacity="1">Veja o quanto.</text><text x="540.0" y="396" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="26" font-weight="400" letter-spacing="0" opacity="1">Erro nas últimas 5 eleições, em pontos percentuais</text><rect x="72" y="440" width="936" height="456" rx="14" fill="#e4dac4"/><text x="195" y="496" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="25" font-weight="700" letter-spacing="2" opacity="1">APURADO</text><text x="610" y="496" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="25" font-weight="700" letter-spacing="2" opacity="1">EM MÉDIA</text><text x="890" y="496" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="25" font-weight="700" letter-spacing="2" opacity="1">PIOR CASO</text><rect x="100" y="526" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="586" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">5%</text><text x="610" y="586" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">± 0,96</text><text x="890" y="586" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="42" font-weight="400" letter-spacing="0" opacity="1">± 1,83</text><rect x="100" y="614" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="674" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">20%</text><text x="610" y="674" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">± 0,73</text><text x="890" y="674" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="42" font-weight="400" letter-spacing="0" opacity="1">± 1,57</text><rect x="100" y="702" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="762" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">50%</text><text x="610" y="762" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">± 0,30</text><text x="890" y="762" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="42" font-weight="400" letter-spacing="0" opacity="1">± 0,79</text><rect x="100" y="790" width="880" height="2" fill="#1c1b19" opacity="0.12"/><text x="195" y="850" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">75%</text><text x="610" y="850" text-anchor="middle" fill="#3d7a4f" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" letter-spacing="0" opacity="1">± 0,14</text><text x="890" y="850" text-anchor="middle" fill="#6b6456" font-family="Lora, Georgia, serif" font-size="42" font-weight="400" letter-spacing="0" opacity="1">± 0,43</text><text x="540.0" y="966" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">Numa disputa decidida por menos que isso, a</text><text x="540.0" y="1006" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" letter-spacing="0" opacity="1">projeção pode apontar o candidato errado</text><text x="540.0" y="1046" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" letter-spacing="0" opacity="1">no começo da noite.</text><rect x="60" y="1130" width="960" height="268" rx="12" fill="none" stroke="#1c1b19" stroke-width="3" opacity="0.35"/><text x="540.0" y="1192" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="30" font-weight="700" letter-spacing="5" opacity="1">SEM LADO</text><text x="540.0" y="1248" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">A página não torce por ninguém e não</text><text x="540.0" y="1288" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">declara vencedor. Mostra sempre a margem</text><text x="540.0" y="1328" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="400" letter-spacing="0" opacity="1">junto do número — e, enquanto a diferença</text><text x="540.0" y="1368" text-anchor="middle" fill="#1c1b19" font-family="Lora, Georgia, serif" font-size="29" font-weight="700" letter-spacing="0" opacity="1">couber nela, diz que ainda não dá para saber.</text><rect x="60" y="1456" width="960" height="230" rx="12" fill="#c8433a"/><text x="540.0" y="1544" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="58" font-weight="700" letter-spacing="2" opacity="1">ISTO NÃO É</text><text x="540.0" y="1612" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="58" font-weight="700" letter-spacing="2" opacity="1">RESULTADO OFICIAL</text><text x="540.0" y="1656" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="27" font-weight="400" letter-spacing="0" opacity="0.92">O resultado que vale é sempre o do TSE.</text><rect x="0" y="1786" width="1080" height="134" fill="#c8433a"/><text x="540.0" y="1843" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="35" font-weight="700" letter-spacing="0" opacity="1">oxeeraassim.github.io/apuracao</text><text x="540.0" y="1890" text-anchor="middle" fill="#f0e8d8" font-family="Lora, Georgia, serif" font-size="25" font-weight="400" letter-spacing="2" opacity="0.8">@oxe_eraassim</text></svg>